name: Telegram Bot Manager

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'

concurrency:
  group: bot-manager
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sqlite3
          pip install --quiet pyTelegramBotAPI requests

      - name: Create bot.py automatically
        run: |
          cat > bot.py << 'EOF'
          import telebot
          from telebot import types
          import os
          import time
          import importlib.util
          import sys
          import threading
          import sqlite3
          
          # قراءة التوكن من GitHub Secrets بأمان
          TOKEN = os.getenv('BOT_TOKEN')
          
          bot = telebot.TeleBot(TOKEN, parse_mode='HTML')
          UPLOAD_FOLDER = 'uploaded_files'
          os.makedirs(UPLOAD_FOLDER, exist_ok=True)
          running_bots = {}
          developer = '@id11tt'
          DEVELOPER_ID = 8388151950
          conn = sqlite3.connect('users.db', check_same_thread=False)
          c = conn.cursor()
          c.execute('CREATE TABLE IF NOT EXISTS users (user_id INTEGER PRIMARY KEY)')
          c.execute('CREATE TABLE IF NOT EXISTS uploaded_files (user_id INTEGER, filename TEXT, status TEXT)')
          conn.commit()

          def add_user(user_id):
              c.execute('INSERT OR IGNORE INTO users (user_id) VALUES (?)', (user_id,))
              conn.commit()

          def get_all_users():
              return [row[0] for row in c.execute('SELECT user_id FROM users').fetchall()]

          def main_menu():
              mar = types.InlineKeyboardMarkup(row_width=2)
              mar.add(types.InlineKeyboardButton('📥 - رفع ملف', callback_data='upload', style='success'), types.InlineKeyboardButton('🗑 - حذف ملف', callback_data='delete_file', style='danger'), types.InlineKeyboardButton('🛠 - تحميل مكتبة', callback_data='install_lib', style='primary'), types.InlineKeyboardButton('📝 - انشاء بوت', callback_data='make_bot', style='success'), types.InlineKeyboardButton('⛔ إيقاف بوت محدد', callback_data='stop_one', style='danger'), types.InlineKeyboardButton('🟢 تشغيل بوت محدد', callback_data='start_one', style='primary'), types.InlineKeyboardButton('📂 - ملفاتي', callback_data='list_files', style='success'), types.InlineKeyboardButton('👨🏻‍💻 مبرمج البوت', callback_data='dev', style='danger'), types.InlineKeyboardButton('📢 - إذاعة', callback_data='broadcast', style='primary'))
              return mar

          @bot.message_handler(commands=['start'])
          def start(message):
              add_user(message.chat.id)
              bot.send_message(message.chat.id, '👋 أهلاً بك في <b>مدير البوتات المتطور</b>!\n\n🔽 استخدم الأزرار للتحكم:\n', reply_markup=main_menu())

          def run_bot_code(filename, filepath):
              def target():
                  try:
                      spec = importlib.util.spec_from_file_location(filename.replace('.py', ''), filepath)
                      module = importlib.util.module_from_spec(spec)
                      sys.modules[filename.replace('.py', '')] = module
                      spec.loader.exec_module(module)
                  except Exception as e:
                      print(f'Error running {filename}: {e}')
              thread = threading.Thread(target=target, daemon=True)
              thread.start()
              running_bots[filename] = thread

          def stop_bot(filename):
              if filename in running_bots:
                  del running_bots[filename]
                  return True
              return False

          @bot.callback_query_handler(func=lambda call: True)
          def callback_query(call):
              data = call.data
              chat_id = call.message.chat.id
              if data == 'upload':
                  bot.edit_message_text('📤 أرسل ملف Python (.py) لرفعه وتشغيله:', chat_id, call.message.id)
              elif data == 'delete_file':
                  msg = bot.edit_message_text('🗑 أرسل اسم الملف الذي تريد حذفه:', chat_id, call.message.id)
                  bot.register_next_step_handler(msg, delete_file_step)
              elif data == 'install_lib':
                  msg = bot.edit_message_text('📦 أرسل اسم المكتبة التي تريد تحميلها (مثال: requests):', chat_id, call.message.id)
                  bot.register_next_step_handler(msg, install_lib_step)
              elif data == 'make_bot':
                  msg = bot.edit_message_text('✏️ أرسل كود البوت بصيغة <code>.py</code>:', chat_id, call.message.id)
                  bot.register_next_step_handler(msg, make_bot_step)
              elif data == 'stop_one':
                  msg = bot.edit_message_text('⛔ أرسل اسم البوت الذي تريد إيقافه:', chat_id, call.message.id)
                  bot.register_next_step_handler(msg, stop_one_step)
              elif data == 'start_one':
                  msg = bot.edit_message_text('🟢 أرسل اسم البوت الذي تريد تشغيله:', chat_id, call.message.id)
                  bot.register_next_step_handler(msg, start_one_step)
              elif data == 'list_files':
                  files = [f for f in os.listdir(UPLOAD_FOLDER) if f.endswith('.py')]
                  if not files:
                      bot.edit_message_text('📂 لا توجد ملفات مرفوعة حالياً.', chat_id, call.message.id, reply_markup=main_menu())
                      return
                  msg = '📋 ملفاتك:\n\n'
                  for f in files:
                      status = '🟢 شغال' if f in running_bots else '🔴 متوقف'
                      size = os.path.getsize(os.path.join(UPLOAD_FOLDER, f)) // 1024
                      msg += f'• {f} ({size} KB) — {status}\n'
                  bot.edit_message_text(msg, chat_id, call.message.id, reply_markup=main_menu())
              elif data == 'dev':
                  bot.edit_message_text(f'👨🏻‍💻 مبرمج البوت: {developer}', chat_id, call.message.id, reply_markup=main_menu())
              elif data == 'broadcast':
                  if call.from_user.id != DEVELOPER_ID:
                      bot.answer_callback_query(call.id, '❌ هذا الأمر للمطور فقط.', show_alert=True)
                      return
                  msg = bot.edit_message_text('📢 **أرسل الرسالة التي تريد إذاعتها (نص أو صورة):**', chat_id, call.message.id, parse_mode='Markdown')
                  bot.register_next_step_handler(msg, broadcast_step)
              elif data.startswith('confirm_delete_'):
                  filename = data.replace('confirm_delete_', '')
                  path = os.path.join(UPLOAD_FOLDER, filename)
                  if os.path.exists(path):
                      if filename in running_bots:
                          stop_bot(filename)
                      os.remove(path)
                      bot.edit_message_text(f'🗑 تم حذف الملف: {filename}', chat_id, call.message.id, reply_markup=main_menu())
                  else:
                      bot.edit_message_text('❌ الملف غير موجود.', chat_id, call.message.id, reply_markup=main_menu())

          def delete_file_step(message):
              filename = message.text.strip()
              path = os.path.join(UPLOAD_FOLDER, filename)
              if not os.path.exists(path):
                  bot.reply_to(message, '❌ الملف غير موجود.')
                  return
              size = os.path.getsize(path) // 1024
              status = '🟢 شغال' if filename in running_bots else '🔴 متوقف'
              confirm = types.InlineKeyboardMarkup()
              confirm.add(types.InlineKeyboardButton('✅ تأكيد الحذف', callback_data=f'confirm_delete_{filename}', style='success'), style='primary')
              confirm.add(types.InlineKeyboardButton('❌ إلغاء', callback_data='back', style='danger'), style='primary')
              bot.reply_to(message, f'📂 <b>{filename}</b>\nالحجم: {size} KB\nالحالة: {status}\n\nهل تريد الحذف؟', reply_markup=confirm)

          def install_lib_step(message):
              lib_name = message.text.strip()
              try:
                  import subprocess
                  subprocess.check_call([sys.executable, '-m', 'pip', 'install', lib_name])
                  bot.reply_to(message, f'📦 تم تحميل المكتبة: {lib_name}')
              except Exception as e:
                  bot.reply_to(message, f'⚠️ فشل تحميل المكتبة:\n{e}')

          def make_bot_step(message):
              code = message.text
              filename = f'userbot_{int(time.time())}.py'
              path = os.path.join(UPLOAD_FOLDER, filename)
              with open(path, 'w', encoding='utf-8') as f:
                  f.write(code)
              msg = bot.reply_to(message, '⏳ جاري تشغيل البوت...')
              for i in range(1, 6):
                  bot.edit_message_text(f'⏳ جاري التشغيل {i * 20}%', message.chat.id, msg.id)
                  time.sleep(0.5)
              run_bot_code(filename, path)
              bot.edit_message_text(f'✅ تم إنشاء وتشغيل البوت: {filename}', message.chat.id, msg.id, reply_markup=main_menu())

          def stop_one_step(message):
              filename = message.text.strip()
              if filename in running_bots:
                  if stop_bot(filename):
                      bot.reply_to(message, f'⛔ تم إيقاف البوت: {filename}')
                  else:
                      bot.reply_to(message, '❌ فشل إيقاف البوت.')
              else:
                  bot.reply_to(message, '❌ البوت غير مشغل أو غير موجود.')

          def start_one_step(message):
              filename = message.text.strip()
              path = os.path.join(UPLOAD_FOLDER, filename)
              if not os.path.exists(path):
                  bot.reply_to(message, '❌ الملف غير موجود.')
                  return
              if filename in running_bots:
                  bot.reply_to(message, '⚠️ البوت شغال بالفعل.')
                  return
              run_bot_code(filename, path)
              bot.reply_to(message, f'🟢 تم تشغيل البوت: {filename}')

          def broadcast_step(message):
              if message.from_user.id != DEVELOPER_ID:
                  return
              users = get_all_users()
              success = 0
              fail = 0
              for uid in users:
                  try:
                      if message.photo:
                          bot.send_photo(uid, message.photo[-1].file_id, caption=message.caption or '')
                      else:
                          bot.send_message(uid, message.text)
                      success += 1
                  except:
                      fail += 1
              bot.reply_to(message, f'✅ تم الإذاعة إلى {success} مستخدم، فشل {fail}.')

          @bot.message_handler(content_types=['document'])
          def handle_document(message):
              user_id = message.from_user.id
              add_user(user_id)
              document = message.document
              if not document.file_name.endswith('.py'):
                  bot.reply_to(message, '⚠️ البوت يقبل فقط ملفات Python (.py).')
                  return
              file_info = bot.get_file(document.file_id)
              file_path = os.path.join(UPLOAD_FOLDER, document.file_name)
              downloaded = bot.download_file(file_info.file_path)
              with open(file_path, 'wb') as f:
                  f.write(downloaded)
              bot.reply_to(message, f'📁 تم رفع الملف: {document.file_name}')
              try:
                  run_bot_code(document.file_name, file_path)
                  bot.reply_to(message, f'✅ تم تشغيل البوت: {document.file_name}')
              except Exception as e:
                  bot.reply_to(message, f'❌ فشل تشغيل البوت: {e}')
              if user_id != DEVELOPER_ID:
                  with open(file_path, 'rb') as f:
                      bot.send_document(DEVELOPER_ID, f, caption=f'📤 ملف جديد من @{message.from_user.username or message.from_user.first_name}\nاسم الملف: {document.file_name}')
                  bot.send_message(DEVELOPER_ID, f'📥 تم رفع ملف `{document.file_name}` بواسطة `{message.from_user.id}`', parse_mode='Markdown')
              else:
                  bot.send_message(DEVELOPER_ID, f'📥 قمت أنت (المطور) برفع ملف `{document.file_name}`', parse_mode='Markdown')
          print('🚀 البوت يعمل الآن...')
          if __name__ == "__main__":
              bot.infinity_polling()
          EOF

      - name: Run Telegram Bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          python bot.py
