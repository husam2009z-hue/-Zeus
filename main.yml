name: auto-recovery-vps
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *' # يشتغل تلقائياً كل 5 ساعات

concurrency:
  group: auto-vps
  cancel-in-progress: false # ما يقطع الجلسة الحالية اذا تأخرت

jobs:
  vps:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libnss3 libgconf-2-4 libxss1 libappindicator1 libindicator7 rsync openssl curl unzip
          pip install --quiet selenium webdriver-manager
          curl -s https://rclone.org/install.sh | sudo bash -s -- --version 1.65.0
      - name: Configure rclone
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: |
          mkdir -p ~/.config/rclone
          echo "$RCLONE_CONF" > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
      - name: Restore from previous life
        env:
          BACKUP_PASS: ${{ secrets.BACKUP_PASS }}
        run: |
          LATEST=$(rclone lsf your-remote:backups/actions/ --files-only --include 'session-*.enc' | sort | tail -1 || true)
          if [ -n "$LATEST" ]; then
            rclone copy "your-remote:backups/actions/$LATEST" /tmp/ --quiet
            openssl enc -d -aes-256-cbc -pbkdf2 -in "/tmp/$LATEST" -out /tmp/restore.tar.gz -pass pass:"$BACKUP_PASS"
            tar -xzf /tmp/restore.tar.gz -C /home/runner/work/ 2>/dev/null || true
            echo "[+] Restored state from: $LATEST"
          fi
      - name: Start backup daemon
        env:
          BACKUP_PASS: ${{ secrets.BACKUP_PASS }}
        run: |
          chmod +x scripts/backup-daemon.sh
          nohup scripts/backup-daemon.sh > /tmp/backup.log 2>&1 &
      - name: Run loop job
        env:
          BACKUP_PASS: ${{ secrets.BACKUP_PASS }}
        run: |
          chmod +x scripts/final-escape.sh
          trap 'scripts/final-escape.sh' EXIT SIGTERM SIGINT
          python scripts/selenium-job.py
      - name: Final escape
        if: always()
        env:
          BACKUP_PASS: ${{ secrets.BACKUP_PASS }}
        run: scripts/final-escape.sh
